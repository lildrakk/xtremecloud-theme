<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>XtremeCloud Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fuente moderna -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700,800" rel="stylesheet" />

    <!-- CSS del tema -->
    <link rel="stylesheet" href="/plugins/xtremecloud-theme/theme.css" />
</head>
<body class="xc-body">
    <div class="xc-app">
        <!-- Sidebar -->
        <aside class="xc-sidebar">
            <div class="xc-logo">
                <span class="xc-logo-mark">XC</span>
                <span class="xc-logo-text">XtremeCloud</span>
            </div>

            <nav class="xc-nav">
                <!-- Pelican inyecta aquí el menú real -->
                <div id="pelican-sidebar"></div>
            </nav>

            <div class="xc-sidebar-footer">
                <span class="xc-badge">PRO PANEL</span>
                <span class="xc-footer-text">Powered by XtremeCloud</span>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="xc-main">
            <header class="xc-header">
                <div class="xc-header-left">
                    <h1 class="xc-title">Panel de control</h1>
                    <p class="xc-subtitle">Gestión avanzada con estilo XtremeCloud.</p>
                </div>
                <div class="xc-header-right">
                    <button class="xc-btn xc-btn-ghost" id="xc-toggle-theme">
                        <span class="xc-dot"></span>
                        Modo oscuro
                    </button>
                </div>
            </header>

            <section class="xc-content">
                <!-- Aquí Pelican inyecta el contenido del panel -->
                <div id="pelican-content"></div>
            </section>
        </main>
    </div>

    <!-- JS del tema -->
    <script src="/plugins/xtremecloud-theme/theme.js"></script>
</body>
</html>
